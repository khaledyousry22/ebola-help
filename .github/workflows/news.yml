name: News update

# Collects Ebola news every hour and saves src/data/news/items.json when it
# changes. A broken feed is skipped; the job only fails if every source fails.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Collect news
        # GDELT is slow and often busy, so it is only tried every six hours.
        run: |
          if [ $(( $(date -u +%-H) % 6 )) -eq 0 ]; then npm run news; else npm run news -- --no-gdelt; fi

      - name: Save changes
        run: |
          git config user.name "ebola-help news bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/news/items.json
          if git diff --cached --quiet; then
            echo "No new news."
            exit 0
          fi
          git commit -m "News: hourly update"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          exit 1
