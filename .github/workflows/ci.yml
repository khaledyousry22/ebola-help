name: Checks

on:
  push:
    branches: [main]
    # Hourly news updates only change this file; they are checked by the news job.
    paths-ignore: ['src/data/news/items.json']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type check and build
        run: npm run build
      - name: Install browser for page tests
        run: npx playwright install --with-deps chromium
      - name: Page tests (languages, accessibility, disclaimer)
        run: npm run test:e2e
